area: states
prefix: STA
rules:
  - id: STA-001
    title: Empty state says why and offers the one action that fills it
    rule: When a list or section has no items yet, replace the empty table with a heading that says what will appear here, one sentence on what it is for, and one primary action that creates the first item.
    why: A bare empty table looks like a loading or permission failure; naming the content and the action that fills it turns the first visit into the first step of the job.
    source: observed
    evidence:
      - {portal: shopify, status: observed, page_type: index}
      - {portal: dhl, status: observed, page_type: settings_page}
      - {portal: cloudflare, status: observed, page_type: settings_page}
    confidence: high
    applies_when: A list, table or section has zero items because nothing has been created or received yet.
    exceptions: Zero results caused by a search or filter use the no-match state (IDX-011); a feature that needs setup or a plan before it can hold items uses its onboarding empty state (ONB-007) or the locked state (STA-005). Controls that act on rows (sort, view tabs, bulk actions) are disabled while the list is empty, not removed.
    do: "Heading 'Create your first API token', one line on what tokens do, button 'Create token', link 'Learn more'; the page's own 'Create' button stays in the title bar."
    dont: "An empty grid with column headers and 'Showing 0-0 of 0' as the only text, or an empty state with three competing buttons."
    check_static: For every list component, find the zero-items branch; verify it renders a heading or sentence naming the missing content, exactly one primary action that creates an item, at most one secondary link, and that row-level controls are disabled (not hidden) in that branch.
    check_live: Open each list on a fresh account or with all items deleted; confirm the explanatory text and a single primary create action are visible without scrolling, and that clicking it opens the create flow.

  - id: STA-002
    title: Empty state sized to its container
    rule: Use a full empty-state block (optional illustration, heading, text, action) when a whole page is empty, and a compact message of at most two lines, with no illustration and at most one inline action, when only a sub-table, tab panel or section inside a larger page is empty.
    why: A page-sized illustration inside a small settings table pushes real controls off screen, while a one-line hint on an otherwise empty page leaves users unsure what the page is for.
    source: observed
    evidence:
      - {portal: shopify, status: observed, page_type: index}
      - {portal: dhl, status: absent, page_type: index}
      - {portal: cloudflare, status: observed, page_type: settings_page}
    confidence: medium
    applies_when: Choosing the visual weight of an empty state.
    exceptions: A primary work-area list that is empty on first use gets the full block even if it sits inside tabs, because it is the main content of the page.
    do: "Whole campaigns page empty: heading, two-line explanation, 'Create campaign', 'Learn more'. Tags table inside a settings page empty: one row reading 'No tags yet. Click Add new to create your first tag.'"
    dont: "A 300px illustration inside a settings card that holds a two-column table, or a top-level list page whose only content is 'No records.'"
    check_static: List every empty-state instance with its container (page main vs card/section/tab panel); verify page-level instances use the full block and nested instances render at most two lines of text, no illustration and at most one inline action.
    check_live: Empty one page-level list and one nested table; at 1440px confirm the nested empty state has no illustration and is no taller than two lines of body text, and the page-level one shows a heading and a primary action in the main area.

  - id: STA-003
    title: Loading placeholders in place and announced
    rule: While data loads, show a placeholder exactly where the value or content will appear (ellipsis, skeleton line or small spinner) and expose it to assistive technology as a status, instead of a blank area, a page-wide blocker or a provisional zero.
    why: An in-place placeholder keeps the layout stable and tells users which part is still coming; a provisional 0 is read as a real value and a blank region is read as broken.
    source: observed
    evidence:
      # shopify: in-place status "Loading" inside the assistant panel; a page-level loading bar also exists; Polaris spinner and table loading state documented
      - {portal: shopify, status: observed, page_type: global}
      # dhl: lazy order-state counters show "..." until loaded
      - {portal: dhl, status: observed, page_type: index}
      # cloudflare: each metric link shows status "Loading..." independently
      - {portal: cloudflare, status: observed, page_type: detail}
    confidence: high
    applies_when: Any page or region whose content arrives asynchronously, including counters in tabs, metric tiles, table bodies and side panels, and any user-started job whose result appears on the page.
    exceptions: A route change may use one thin top progress bar for the page shell; the regions inside still follow this rule. Home blocks additionally load independently (HOM-010). A short confirmation action (Save, Delete) may show progress on its own button (disabled with a spinner) instead of in the content.
    do: "Tab counters read 'Printed …' until counted; metric links read 'Invocations Loading...' with a status role; a table shows skeleton rows of the final height."
    dont: "Counters that show 0 and then jump to 12, a full-screen spinner over the whole admin, or an empty main area with no indication that anything is loading."
    check_static: For each async component, verify a loading branch renders a placeholder in the same slot with role="status" or aria-busy="true" on the region, and that numeric fields are null (not 0) until the response arrives.
    check_live: Throttle the network to Slow 3G and reload list, detail and home pages; confirm every pending region shows a placeholder in place, no counter shows 0 before its real value, and a screen reader or the accessibility tree reports a loading status.

  - id: STA-004
    title: A failed region says so and offers retry
    rule: When a page or region fails to load, replace it with a short message that says what could not be loaded and a Retry action, and keep the rest of the page usable.
    why: A blank region after a failure cannot be told apart from an empty or still-loading one, so users wait, reload the whole app or conclude they have no data.
    source: inferred
    evidence:
      - {portal: shopify, status: absent, page_type: other}
      - {portal: dhl, status: absent, page_type: other}
      - {portal: cloudflare, status: absent, page_type: index}
    confidence: low
    applies_when: A request for page or region content fails or times out.
    exceptions: Optional dashboard widgets may collapse to a one-line message inside the widget. Unknown URLs use the not-found page (STA-006). Failures of a user-submitted form are shown as field errors and a form-level message, not as a region error. Failures that block all work (session expired, service down) use one page-level banner instead of one message per region.
    do: "Videos list area: 'Videos could not be loaded.' with a 'Retry' button; the sidebar, title and other cards stay interactive."
    dont: "The main area stays blank after 15 seconds with no message, no spinner and no empty state."
    check_static: For each data-fetching component, verify there is an error branch distinct from the empty and loading branches, that it renders a message naming the content and a retry handler that refetches only that region, and that an error boundary wraps each independent region.
    check_live: Block one API endpoint in devtools (request blocking) and reload; confirm the affected region shows the error message and Retry within the request timeout, other regions render normally, and Retry recovers after unblocking.

  - id: STA-005
    title: Locked features stay visible with the requirement and the unlock path
    rule: When a feature or option is unavailable because of the plan, an entitlement or another setting, keep it visible but disabled, state in visible text what is required, and offer the action that unlocks it next to it.
    why: Hidden features cannot be discovered or bought, and a feature that looks available but fails after a click wastes the attempt; stating the requirement up front lets users decide to upgrade or change the blocking setting.
    source: observed
    evidence:
      - {portal: shopify, status: absent, page_type: settings_page}
      - {portal: dhl, status: observed, page_type: settings_page}
      - {portal: cloudflare, status: observed, page_type: detail}
    confidence: medium
    applies_when: A control, tab or whole section exists in the product but the current account cannot use it.
    exceptions: When a whole tab or page is locked, replace its content with the requirement and an unlock action instead of disabling every control; still keep the tab in navigation. Explanation copy for a single disabled control follows HLP-006. Role-based restrictions are not covered here (see open questions).
    do: "Disabled switch labelled with its plan ('Pro plan') beside an 'Upgrade plan' button; a locked tab whose content names the required plan and offers 'Upgrade plan' and 'Contact sales'."
    dont: "An enabled control that opens a 'No access' dialog only after the click, or a locked tab whose content is a sentence about a paid plan with no upgrade or contact action."
    check_static: For every entitlement or dependency check in the UI code, verify the gated control renders in a disabled state (not omitted), that adjacent visible text names the requirement, and that an unlock action (upgrade link, link to the blocking setting) is rendered; verify no gated action is reachable only to fail server-side.
    check_live: Use an account on the lowest plan; open each page with plan-gated features and confirm each is visible, disabled, explained in text and paired with an unlock action; click every enabled control and confirm none returns an entitlement or access error.

  - id: STA-006
    title: Not-found page inside the shell with a way forward
    rule: Render an unknown or removed URL as a not-found page inside the normal navigation shell, with a plain heading that the page does not exist and at least one way forward (search, a home or parent link).
    why: Keeping the shell lets users continue from where they are; a heading plus a next step turns a dead link into a one-click detour instead of a reason to log out and back in.
    source: observed
    evidence:
      - {portal: shopify, status: observed, page_type: other}
      - {portal: dhl, status: absent, page_type: other}
      - {portal: cloudflare, status: observed, page_type: other}
    confidence: medium
    applies_when: A route does not match, or an object id in the URL no longer exists or is outside the current scope.
    exceptions: A deleted object reached from a stale link may say it was deleted and link to its list instead of the generic text.
    do: "Sidebar and search visible; heading 'There's no page at this address'; text 'Check the URL, or search for what you need' with search focused or linked; link back to the area's overview."
    dont: "A bare server 404 page without the app chrome, or a blank main area with no heading."
    check_static: In the router, verify a catch-all route and object-not-found responses render a component inside the authenticated layout, with an h1 or h2 stating the page does not exist and at least one link or control for search or home.
    check_live: Visit an invalid path and an invalid object id in each top-level area; confirm the sidebar stays visible, the heading explains the page is missing, and a search or home link works.
