area: microcopy
prefix: MCP
rules:
  - id: MCP-001
    title: Buttons start with a verb and name the object
    rule: Label every action button with an imperative verb followed by the object it acts on, and keep a bare verb only when the object is unambiguous from the surrounding card or dialog.
    why: A verb tells users the button does something, and the object tells them to what; a list of verb + object buttons can be scanned without reading the page around it.
    source: documented
    evidence:
      # shopify: Add product, Add customer, Create order, Create discount, Create segment, Add recipient (products, customers, orders, discounts, customers-segments, settings-notifications-staff); docs: buttons are verb + noun
      - {portal: shopify, status: observed, page_type: index}
      # dhl: verb-led (Import now, Run rules now, Print and close) but the object is usually missing: bare "Add new" is the standard create button (about 40 hits across evidence; settings-rules, address-book, settings-checkout-rates-rules), so the verb + object half is contradicted
      - {portal: dhl, status: absent, page_type: settings_page}
      # cloudflare: Add domain, Create rule, Rotate token, Deploy (domains-overview, zone-custom-rule-builder, tunnel-detail)
      - {portal: cloudflare, status: observed, page_type: index}
    confidence: medium
    applies_when: Primary and secondary buttons on pages, cards, toolbars and dialogs.
    exceptions: Standard short commands whose object is the whole form or dialog (Save, Cancel, Close, Export, Import) may stay a bare verb, as may Edit and Apply inside a card or dialog that names its object; toggles that show a state use the state or setting name instead.
    do: '"Add product", "Create rule", "Rotate token", "Print label".'
    dont: '"New", "Add new", "OK", "Go", "Submit" on a page with several objects.'
    check_static: Extract all button labels from the component tree or string catalog; flag any whose first word is not a verb from the product's verb list, and any lone verb outside the allowed set (Save, Cancel, Close, Export, Import, Edit, Apply).
    check_live: Dump the accessibility tree of each index and detail page; every role=button with visible text must start with a verb from the verb list, and the primary button of an index page must contain the singular of the H1 noun (H1 "Products", button "Add product") unless it is on the allowed bare-verb list.

  - id: MCP-002
    title: Sentence case for all interface text
    rule: Write menu items, page titles, headings, tabs, column headers, buttons and section labels in sentence case, capitalising only the first word and proper names, and never store labels in ALL CAPS.
    why: One casing rule removes a whole class of inconsistency; mixed Title Case and sentence case on one screen looks unfinished, and ALL CAPS text is slower to read and is spelled out letter by letter by some screen readers.
    source: documented
    evidence:
      # shopify: sentence case across nav, settings and buttons (home, settings); docs: sentence case for headings, buttons and card titles
      - {portal: shopify, status: documented, page_type: global}
      # dhl: sentence-case menu and buttons, but settings group labels in UPPERCASE (settings-couriers)
      - {portal: dhl, status: observed, page_type: settings_index}
      # cloudflare: design-system docs require sentence case with product names title-cased; live UI drifts ("Posture Findings", "Active Subscriptions", "Expires On" next to sentence-case labels)
      - {portal: cloudflare, status: documented, page_type: global}
    confidence: high
    applies_when: All visible labels and headings in the product.
    exceptions: Proper product or feature names and acronyms keep their own capitalisation (API, DNS). A small uppercase eyebrow style may be applied with CSS text-transform as long as the source string stays in sentence case.
    do: '"Shipping and delivery", "Edge certificates", "Create purchase order", column "Expires on".'
    dont: '"Posture Findings" beside "Cloud & SaaS findings"; heading "Active Subscriptions"; a hard-coded "ORDER MANAGEMENT" string.'
    check_static: Lint the string catalog; flag strings with two or more capitalised words that are not in the proper-name allowlist, and strings that are entirely uppercase.
    check_live: On each page, read element.textContent (the source string, before CSS text-transform) of every heading, tab, columnheader, button and nav link; report any label with two or more capitalised words not in the proper-name allowlist, and any label that is entirely uppercase in the source.

  - id: MCP-003
    title: Destinations are nouns, commands are verbs
    rule: In every menu (sidebar, user menu, overflow menu), word items that open a page as nouns and items that perform an action as verbs, so the wording tells users what will happen on click.
    why: Users predict the result of a click from its grammar; a noun promises a place, a verb promises a change, and mixing them misleads.
    source: documented
    evidence:
      # shopify: nav items are nouns (Orders, Products, Customers); user menu commands are verbs (Log out, Create store) (home, chrome-profile); docs: nav labels are nouns, not verbs
      - {portal: shopify, status: observed, page_type: global}
      # dhl: nav nouns (Orders, Manifests, Pickups, Quotes); user menu mixes destinations as nouns (Knowledge base, Logs) and commands as verbs (Submit a ticket, Toggle dark mode, Log out) (orders-new-1440, profile-menu, support-menu)
      - {portal: dhl, status: observed, page_type: global}
      # cloudflare: nav nouns (Workers & Pages, Edge Certificates, Access settings); user menu destinations are nouns (Profile, Billing), Log out is a verb (sidebar-account-expanded, account-switcher); docs: labels name the task area
      - {portal: cloudflare, status: observed, page_type: global}
    confidence: high
    applies_when: Sidebar navigation, tabs, user and account menus, overflow menus that mix links and actions.
    exceptions: Overflow menus that only hold actions on one object are all verbs. A nav item for a single dominant task may use the task noun ("Search") rather than the verb.
    do: 'Sidebar "Orders", "Pickups"; user menu "Profile", "Billing", "Log out".'
    dont: 'Sidebar "Manage users", "View reports"; user menu "Go to billing" next to "Profile".'
    check_static: In nav and menu definitions, flag items with an href whose label starts with a verb, and items with an onClick action (no href) whose label does not start with a verb.
    check_live: Open each menu; for every menuitem or link, read whether it carries an href; items with an href must not start with a verb, items without an href must start with a verb from the verb list.

  - id: MCP-004
    title: Short button labels without filler
    rule: Keep button labels to one to three words, verb first, with no articles, no "new", no "now" and no explanatory clause; put any explanation in helper text next to the button.
    why: Short labels fit in toolbars and narrow screens and are read at a glance; filler words push the object out of view and make labels inconsistent.
    source: documented
    evidence:
      # shopify: two-word labels (Add product, Create order, Buy labels); docs: aim for 2-word buttons, lead with the verb, drop articles (order action guidance)
      - {portal: shopify, status: documented, page_type: index}
      # dhl: filler is common ("Add a new rule", "Import now", "Run rules now", "Test to ensure it works") (settings-returns-rules, settings-integrations-csv-ftp)
      - {portal: dhl, status: absent, page_type: settings_page}
      # cloudflare: mostly short (Add domain, Create rule, Rotate token), but articles appear in primary buttons ("Add an identity provider", "Create a token") (domains-overview, zt-integrations-idp, api-tokens), so the no-articles half is contradicted
      - {portal: cloudflare, status: absent, page_type: index}
    confidence: high
    applies_when: All buttons and menu commands.
    exceptions: A qualifier is allowed when two buttons on the same screen would otherwise collide ("Create custom rule" next to "Create rate limiting rule").
    do: '"Add rule", "Test connection", "Import orders", "Add identity provider".'
    dont: '"Add a new rule", "Run rules now", "Test to ensure it works", "Click here to import".'
    check_static: Flag button strings longer than three words unless listed as a collision qualifier, and strings containing the whole words "a", "an", "the", "new", "now", "here" or "please".
    check_live: On each page, list button accessible names (visible text, not aria-label extensions added for MCP-005); report any over three words or containing the filler words above as whole words.

  - id: MCP-005
    title: Repeated buttons name their object
    rule: When the same action appears on several rows or cards, include the object in the accessible name (visible or via aria-label) so each instance is unique.
    why: A screen-reader or voice user who hears "Pin, Pin, Pin" or "Add new" ten times cannot tell which item each button affects; automation and tests cannot target them either.
    source: inferred
    evidence:
      # shopify: contradicted: products rows repeat "View sales channel details", "View on Online Store" and "View catalogs" 50 times each, analytics repeats "View details for 0%", and the inner "Pin to your navigation" button is bare (products, analytics, home-1440)
      - {portal: shopify, status: absent, page_type: index}
      # dhl: contradicted: column controls name their object ("Sort by name", "Resize customer column") but row actions do not: "Remove shipping method" repeats 3 times with one name, "Add new" is bare (integration-shopify-other-tools, settings-rules)
      - {portal: dhl, status: absent, page_type: settings_page}
      # cloudflare: product list rows each have a bare "Pin" button and tiles a bare "Tile options" (agents, account-analytics)
      - {portal: cloudflare, status: absent, page_type: index}
    confidence: low
    applies_when: Row actions in tables and lists, card actions repeated across a grid, per-item pin/star/remove buttons.
    exceptions: The visible label may stay short ("Pin") if the accessible name adds the object ("Pin Invoices").
    do: 'Visible "Remove", accessible name "Remove shipping method Standard"; "Sort by order date".'
    dont: 'Thirty buttons all named "Pin"; every card with an "Add new" button.'
    check_static: In list and table row templates, check that action buttons receive an aria-label or visually hidden text interpolating the row's name; lint for duplicate accessible names within one page.
    check_live: Dump the accessibility tree per page; group buttons by accessible name; any name repeated more than once that is not a global control (Close, Save) is a failure.

  - id: MCP-006
    title: One verb per kind of action
    rule: Define a product-wide verb list (for example "Add" to put an existing or simple item into a list, "Create" to build a new configured object, "Remove" to take out of a list, "Delete" to destroy) and use each verb only for its meaning.
    why: When the same act is called "Add new", "Add a new rule" and "Create rule" on neighbouring pages, users wonder whether they are different operations; a fixed verb list makes behaviour predictable.
    source: inferred
    evidence:
      # shopify: drift: Add product/customer/collection vs Create order/discount/segment/market (products, orders, discounts, markets)
      - {portal: shopify, status: absent, page_type: index}
      # dhl: drift: "Add new", "Add a new rule" and "Create rule" for the same kind of object (settings-returns-rules, settings-document-manager-rules)
      - {portal: dhl, status: absent, page_type: settings_page}
      # cloudflare: drift: Add domain vs Create rule; "Create Token" and "Create a token" on the same page (domains-overview, zone-custom-rule-builder, api-tokens)
      - {portal: cloudflare, status: absent, page_type: index}
    confidence: low
    applies_when: Any product with more than one create or remove flow.
    exceptions: Domain verbs with a fixed meaning for the user (Print, Deploy, Rotate, Purge) are kept and added to the list rather than replaced by a generic verb.
    do: 'Every list uses "Add <item>"; every configurable object uses "Create <object>"; Remove takes out of a list, Delete destroys.'
    dont: '"Add new" on one rules page, "Create rule" on the next, "Delete" used for unlinking a member.'
    check_static: Keep the verb list in the string catalog or a lint config; grep button labels and flag verbs not on the list and the same object noun paired with two different create verbs.
    check_live: Collect every create-type button across index pages; for each object noun, confirm only one verb is used.

  - id: MCP-007
    title: One term per concept, one concept per term
    rule: Keep a glossary and use the same term for a concept in the menu, page title, breadcrumbs, buttons, notifications and shortcuts, matching singular and plural, and never reuse one term for two different concepts.
    why: Different words for the same thing ("Quotes" in the menu, "Quote" as the title) and the same word for different things ("Notifications" for toasts and for a settings tab) make users doubt they are in the right place.
    source: inferred
    evidence:
      # shopify: area renamed to Growth while the shortcut sheet still says "Go to Marketing" (keyboard-shortcuts vs growth)
      - {portal: shopify, status: absent, page_type: global}
      # dhl: menu "Quotes" vs page title "Quote"; "Fulfillment" and "fulfilment" both used (integration-shopify-advanced, settings-tracking-notifications)
      - {portal: dhl, status: absent, page_type: global}
      # cloudflare: "Notifications" names both the toast region and a profile tab while alert rules are "Alerts" (notifications, profile-notifications); docs: search matches old and new names after a rename
      - {portal: cloudflare, status: absent, page_type: global}
    confidence: low
    applies_when: Every user-facing noun for an object, area or feature.
    exceptions: After a rename, the old term may survive only as a search alias, never as a visible label.
    do: 'Menu "Quotes", title "Quotes", breadcrumb "Quotes"; toasts announced as "Status messages", alert rules under "Notifications".'
    dont: 'Menu "Quotes", page title "Quote"; "Notifications" meaning both toasts and email alerts.'
    check_static: Maintain a glossary file; derive nav labels, page titles and shortcut labels from the same keys; flag string-catalog entries that use a glossary synonym or differ only by plural from the canonical term.
    check_live: For each nav item, compare its label with the H1, breadcrumb and tab title of the target page; flag any mismatch, including singular vs plural; flag any accessible name used both for a landmark or live region and for a nav link or tab that leads to a different page.

  - id: MCP-008
    title: One spelling variant across the product
    rule: Choose one English variant (for example American) for the whole interface and spell every word, including variants of the same word, in that variant only.
    why: Mixed spellings ("fulfillment" next to "fulfilment") look careless, break search and filtering by text, and suggest the strings come from different products.
    source: documented
    evidence:
      # shopify: American English throughout; docs: American English base, grade-7 reading level
      - {portal: shopify, status: documented, page_type: global}
      # dhl: British by default (Customise, Colours, catalogue) but "Fulfillment" and "fulfilment" both appear (integration-shopify-advanced, settings-packaging, settings-tracking-notifications)
      - {portal: dhl, status: absent, page_type: global}
      # cloudflare: American English throughout (sidebar, settings pages)
      - {portal: cloudflare, status: observed, page_type: global}
    confidence: high
    applies_when: All source-language strings, before translation.
    exceptions: Text copied from a third party (carrier service names, integration names) keeps its original spelling.
    do: '"Customize", "Colors", "Fulfillment" everywhere in an American English product.'
    dont: '"Fulfillment" in the menu and "fulfilment" in the settings help.'
    check_static: Run a spell checker set to the chosen locale over the string catalog (for example cspell with en-US only) and fail on words from the other variant.
    check_live: Extract page text from every page in a crawl and check it with the same locale dictionary; report pages containing other-variant spellings.
